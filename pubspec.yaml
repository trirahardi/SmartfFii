name: mobile
description: "SmartFi Mobile - Catat Keuangan + Mentor AI Pribadi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_markdown: ^0.7.6
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  pdf: ^3.11.2
  printing: ^5.13.4
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  audioplayers: ^6.1.2
  uuid: ^4.5.1
  http: ^1.2.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  archive: ^4.5.2
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
